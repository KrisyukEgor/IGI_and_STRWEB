{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <h2>Список пользователей</h2>
    <table class="table">
        <thead>
        <tr>
            <th>Email</th>
            <th>Дата регистрации</th>
        </tr>
        </thead>
        <tbody>
        {% for user in users %}
        <tr>
            <td>{{ user.email }}</td>
            <td>{{ user.date_joined }}</td>
        </tr>
        {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
